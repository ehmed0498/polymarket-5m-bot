
name: Polymarket Paper Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract bot
        run: |
          unzip -o polymarket_5m_bot_final_fix_404_fixed.zip -d bot

      - name: Install dependencies
        working-directory: bot/polymarket_5m_bot
        run: |
          pip install -r requirements.txt

      - name: Test Polymarket API
        run: |
          python - <<'PY'
          import urllib.request
          import time

          base = "https://gamma-api.polymarket.com"

          print("===== POLYMARKET API TEST =====")

          for path in [
              "/events?active=true&closed=false&limit=5",
              "/markets?active=true&closed=false&limit=5"
          ]:
              url = base + path
              print("\nGET:", url)
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = r.read().decode()
                      print("STATUS:", r.status)
                      print(data[:5000])
              except Exception as e:
                  print("ERROR:", repr(e))

          now = int(time.time())
          base_time = (now // 300) * 300

          print("\n===== BTC 5-MINUTE TEST =====")

          for i in [-2, -1, 0, 1, 2]:
              timestamp = base_time + (i * 300)
              slug = f"btc-updown-5m-{timestamp}"
              url = f"{base}/events/slug/{slug}"

              print("\nSLUG:", slug)

              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = r.read().decode()
                      print("STATUS:", r.status)
                      print(data[:3000])
              except Exception as e:
                  print("ERROR:", repr(e))

          print("\n===== TEST COMPLETE =====")
          PY

      - name: Start paper bot
        working-directory: bot/polymarket_5m_bot
        run: |
          python main.py
