name: Polymarket Paper Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Polymarket API
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://gamma-api.polymarket.com/events?limit=1"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "PolymarketPaperBot/1.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("API status:", response.status)
                  print("Polymarket API connection successful.")
          except Exception as error:
              print("API connection failed:", error)
              raise
          PY

      - name: Extract bot
        run: |
          unzip -o polymarket_paper_bot_v2_auto_discover.zip -d bot

      - name: Install dependencies
        working-directory: bot/polymarket_5m_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start paper bot
        working-directory: bot/polymarket_5m_bot
        env:
          LIVE_TRADING: "false"
          STARTING_BALANCE: "100"
          BOT_RUNTIME_MINUTES: "60"
        run: |
          python -u main.py

      - name: Upload paper-trading reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-bot-report
          path: |
            bot/polymarket_5m_bot/trades.csv
            bot/polymarket_5m_bot/paper_report.txt
          if-no-files-found: warn
          retention-days: 7
